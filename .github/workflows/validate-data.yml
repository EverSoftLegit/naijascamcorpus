name: Validate dataset and tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Run all data checks (consistency, schema, duplicates, manifest)
        run: python scripts/validate_all.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run reproducible benchmark (smoke)
        run: python benchmark/run_benchmark.py
