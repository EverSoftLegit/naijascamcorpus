name: Documentation or research reference
description: Suggest documentation improvements or a relevant public research reference.
title: "[Docs/Research]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: "Do not paste protected text or private incident details. Provide a citation and a short original summary."
  - type: textarea
    id: suggestion
    attributes:
      label: Suggestion or summary
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Public source URL or citation
    validations:
      required: false
  - type: textarea
    id: licence
    attributes:
      label: Licence or reuse notes (if known)
    validations:
      required: false
