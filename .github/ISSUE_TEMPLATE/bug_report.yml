name: Tooling or repository bug
description: Report a reproducible issue with project code, schema, documentation, or repository workflow.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include real scam messages, screenshots, victim evidence, personal data, credentials, financial identifiers, or live malicious URLs."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the repository or tooling problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
    validations:
      required: false
